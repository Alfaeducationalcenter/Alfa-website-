<!-- BANNER - IMEKAA SAWA SASA -->
<div style="max-width:1100px;margin:0 auto;background:#000;position:relative;height:400px;overflow:hidden">
  <img id="mainBanner" src="slide1.jpg" style="width:100%;height:400px;object-fit:cover;display:block" onerror="this.src='logo-hd.jpg'">
  <div id="capText" style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.7);color:white;padding:10px;text-align:center;font-size:13px">ALFA EDUCATIONAL CENTER - Mhangu B</div>
</div>

<script>
const pics=[
 {f:"slide1.jpg", t:"Wanafunzi wa ALFA - Mazingira Bora"},
 {f:"slide2.jpg", t:"Darasa la Kisasa - Academic Excellence"},
 {f:"slode2.jpg", t:"Darasa la Kisasa"},
 {f:"mkurugenzi.jpg", t:"Mkurugenzi - Ndg. MWL. EMMANUEL MASHAURY SHINJE"},
 {f:"mkurugenzi .jpg", t:"Mkurugenzi"},
 {f:"slide3.jpg", t:"Walimu Mahiri wa ALFA"},
 {f:"logo-hd.jpg", t:"ALFA EDUCATIONAL CENTER (AEC)"}
];
let i=0;
setInterval(()=>{
 i=(i+1)%pics.length;
 let img=document.getElementById("mainBanner");
 let cap=document.getElementById("capText");
 // jaribu picha inayofuata
 img.src=pics[i].f;
 cap.innerText=pics[i].t;
 img.onerror=function(){ // kama haipo, ruka
   i=(i+1)%pics.length;
   img.src=pics[i].f;
   cap.innerText=pics[i].t;
 };
},3500);
</script>
